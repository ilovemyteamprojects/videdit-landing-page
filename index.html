<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css" />
    <title>Videdit</title>
  </head>

  <body
    class="bg-green-500 font-ruda flex flex-col items-center justify-center overflow-x-hidden min-h-screen"
  >
    <main class="">
      <!-- hero -->
      <section
        id="heroSection"
        x-ref="heroSection"
        x-data="heroSectionData"
        class="relative flex flex-col w-screen h-[100dvh] text-white bg-black"
        @click="pauseVideo"
      >
        <video
          x-ref="headerVideo"
          id="bgVideo"
          muted
          autoplay
          loop
          playsinline
          class="size-full object-cover brightness-65"
        >
          <source src="HeaderVideo.webm" type="video/webm" />
          <source src="HeaderVideo.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>

        <!-- header -->
        <header
          x-data="{isMenuOpen: false, isKeyboardNavigationUsed: false}"
          x-cloak
          x-show="show"
          x-transition.duration.500ms
          class="absolute top-0 flex flex-row justify-between w-full h-20 pc:h-25 px-4 tab:px-6 pc:px-10 desk:px-15 bg-black/60 uppercase"
        >
          <a
            href="#heroSection"
            class="cursor-pointer my-auto"
            aria-label="go to top"
            data-interactive
          >
            <img
              id="logo"
              class="size-11 tab:size-16 pc:size-20"
              src="/logo.svg"
              alt="logo"
              data-interactive
            />
          </a>

          <nav class="my-auto hidden pc:flex">
            <ul class="flex gap-10">
              <li>
                <a
                  class="hover:underline text-white text-lg font-ruda"
                  href="#services"
                  x-text="$t('header.services')"
                  data-interactive
                  >Послуги</a
                >
              </li>
              <li>
                <a
                  class="hover:underline text-white text-lg font-ruda"
                  href="#portfolio"
                  x-text="$t('header.portfolio')"
                  data-interactive
                  >Портфоліо</a
                >
              </li>
              <li>
                <a
                  class="hover:underline text-white text-lg font-ruda"
                  href="#about"
                  x-text="$t('header.aboutMe')"
                  data-interactive
                  >Про мене</a
                >
              </li>
            </ul>
          </nav>

          <div id="tools" class="hidden pc:flex gap-6 pr-3">
            <button
              class="tracking-wider uppercase flex h-6 px-2 my-auto hover:cursor-pointer"
              @click="$locale($locale() === 'ua' ? 'eng' : 'ua')"
              :aria-label="$locale() === 'ua' ? 'Switch to English' : 'Переключити на українську'"
              data-interactive
            >
              <span
                data-interactive
                :class="$locale() === 'ua' ? 'text-white hover:underline' : 'text-white/60 hover:underline'"
                >ua</span
              >|<span
                data-interactive
                :class="$locale() === 'eng' ? 'text-white hover:underline' : 'text-white/60 hover:underline'"
                >eng</span
              >
            </button>
            <button
              id="contactsButton"
              class="h-10 w-22 bg-dark my-auto text-white text-lg font-bold font-alumni hover:cursor-pointer"
              x-text="$t('header.contacts')"
              @click="alert('Contacts button triggered!')"
              data-interactive
            >
              Контакти
            </button>
          </div>

          <button
            class="tracking-wider uppercase pc:hidden flex h-6 px-2 my-auto hover:cursor-pointer"
            @click="$locale($locale() === 'ua' ? 'eng' : 'ua')"
            :aria-label="$locale() === 'ua' ? 'Switch to English' : 'Переключити на українську'"
            data-interactive
          >
            <span
              data-interactive
              :class="$locale() === 'ua' ? 'text-white hover:underline' : 'text-white/60 hover:underline'"
              >ua</span
            >|<span
              data-interactive
              :class="$locale() === 'eng' ? 'text-white hover:underline' : 'text-white/60 hover:underline'"
              >eng</span
            >
          </button>

          <button
            id="burgerMenu"
            @click="isMenuOpen = true; $nextTick(() => $refs.closeNavButton.focus())"
            @keydown.space="isKeyboardNavigationUsed = true"
            @keydown.enter="isKeyboardNavigationUsed = true"
            aria-label="open navigation menu"
            x-show="!isMenuOpen"
            x-ref="burger"
            x-transition:enter="transition transform ease-in duration-500"
            x-transition:enter-start="rotate-0 opacity-0"
            x-transition:enter-end="rotate-360 opacity-100"
            x-transition:leave="transition transform ease-out duration-500"
            x-transition:leave-start="rotate-0 opacity-100"
            x-transition:leave-end="-rotate-360 opacity-0"
            class="my-auto rounded-full mr-[5px] pc:hidden cursor-pointer"
            data-interactive
          >
            <img
              data-interactive
              src="/burger-button.svg"
              alt="menu"
              class="size-11"
            />
          </button>

          <!-- mob menu -->
          <div
            id="mobileMenu"
            @keydown.esc="$nextTick(()=> {if (isKeyboardNavigationUsed)$refs.burger.focus()}); isMenuOpen = false;"
            x-cloak
            x-trap="isMenuOpen"
            x-show="isMenuOpen"
            x-transition:enter="transition-opacity duration-500 ease-in-out"
            x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100"
            x-transition:leave="transition-opacity duration-500 ease-in-out"
            x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0"
            class="pc:hidden flex flex-col w-[100dvw] h-[100dvh] bg-dark fixed z-10 top-0 right-0"
            data-interactive
          >
            <header
              id="mobMenuHeader"
              class="flex flex-row justify-between w-full h-20 pc:h-25 px-4 tab:px-6 pc:px-10 desk:px-15 uppercase"
            >
              <button
                class="cursor-pointer my-auto"
                aria-label="close menu"
                @click="isMenuOpen = false"
                data-interactive
              >
                <img
                  id="logo"
                  class="size-11 tab:size-16 pc:size-20"
                  src="/logo.svg"
                  alt="logo"
                  data-interactive
                />
              </button>

              <button
                class="tracking-wider uppercase pc:hidden flex h-6 px-2 my-auto hover:cursor-pointer"
                @click="$locale($locale() === 'ua' ? 'eng' : 'ua')"
                :aria-label="$locale() === 'ua' ? 'Switch to English' : 'Переключити на українську'"
                data-interactive
              >
                <span
                  data-interactive
                  :class="$locale() === 'ua' ? 'text-white hover:underline' : 'text-white/60 hover:underline'"
                  >ua</span
                >|<span
                  data-interactive
                  :class="$locale() === 'eng' ? 'text-white hover:underline' : 'text-white/60 hover:underline'"
                  >eng</span
                >
              </button>

              <button
                id="closeMenu"
                x-ref="closeNavButton"
                @click="isMenuOpen = false; $nextTick(() => $refs.burger.focus())"
                aria-label="open navigation menu"
                x-show="isMenuOpen"
                x-transition:enter="transition transform ease-in duration-500"
                x-transition:enter-start="rotate-0 opacity-0"
                x-transition:enter-end="rotate-360 opacity-100"
                x-transition:leave="transition transform ease-out duration-500"
                x-transition:leave-start="rotate-0 opacity-100"
                x-transition:leave-end="-rotate-360 opacity-0"
                class="block my-auto rounded-full mr-[5px] pc:hidden cursor-pointer"
                data-interactive
              >
                <img
                  data-interactive
                  src="/close-button.svg"
                  alt="menu"
                  class="size-11"
                />
              </button>
            </header>

            <ul class="mx-auto mt-9 flex flex-col gap-5">
              <li class="tab:ml-2">
                <a
                  class="w-72 h-10 tab:h-14 desk:h-16 flex items-center justify-center bg-dark font-alumni font-bold text-lg tab:text-2xl desk:text-2xl-plus border border-transparent hover:border-light"
                  href="#services"
                  x-text="$t('header.services')"
                  @click="isMenuOpen = false"
                  data-interactive
                  >Послуги</a
                >
              </li>
              <li class="tab:ml-2">
                <a
                  class="w-72 h-10 tab:h-14 desk:h-16 flex items-center justify-center bg-dark font-alumni font-bold text-lg tab:text-2xl desk:text-2xl-plus border border-transparent hover:border-light"
                  href="#portfolio"
                  x-text="$t('header.portfolio')"
                  @click="isMenuOpen = false"
                  data-interactive
                  >Портфоліо</a
                >
              </li>
              <li class="tab:ml-2">
                <a
                  class="w-72 h-10 tab:h-14 desk:h-16 flex items-center justify-center bg-dark font-alumni font-bold text-lg tab:text-2xl desk:text-2xl-plus border border-transparent hover:border-light"
                  href="#about"
                  x-text="$t('header.aboutMe')"
                  @click="isMenuOpen = false"
                  data-interactive
                  >Про мене</a
                >
              </li>
              <li class="ml-2">
                <button
                  class="w-72 h-10 tab:h-14 desk:h-16 flex items-center justify-center btn-blur font-alumni font-bold text-lg tab:text-2xl desk:text-2xl-plus cursor-pointer"
                  x-text="$t('header.contacts')"
                  @click="isMenuOpen = false; alert('Contacts button been triggered!')"
                  data-interactive
                >
                  Контакти
                </button>
              </li>
            </ul>
          </div>
        </header>

        <!-- title -->
        <div
          x-ref="title"
          x-data="heroTitle"
          x-effect="isTitleTriggered = show; calcHeroCardOffset()"
          class="p-0 absolute z-[3] min-w-1 leading-tight text-[4rem]"
          :style="styles"
        >
          <p
            x-text="$t('hero.title')"
            class="uppercase p-0 m-0 font-bold font-alumni text-white"
          ></p>
        </div>

        <!-- card -->
        <!-- inline style & x-effect - for preventing card from flickering
       but still keeping it in the DOM -->
        <div
          style="opacity: 0"
          id="heroCard"
          x-ref="heroContainer"
          x-effect="show ? $refs.heroContainer.style.opacity = '100%' : null"
          class="transition-all ease-in duration-500 flex-col z-[2] absolute bottom-15 tab:bottom-10 pc:bottom-[8.5%] left-[calc((100%-288px)/2)] tab:left-6 pc:left-10 desk:left-16 w-72 tab:w-111 pc:w-150"
        >
          <p
            x-text="$t('hero.description')"
            class="tab:w-4/5 pc:w-auto mb-8 tab:mb-14 desk:mb-15 pc:leading-8 text-base tab:text-xl pc:text-2xl desk:text-2xl-plus"
          ></p>

          <div class="flex flex-col pc:flex-row gap-4 tab:gap-6">
            <button
              class="w-72 h-10 tab:h-14 desk:h-16 bg-dark font-alumni font-bold text-lg tab:text-2xl desk:text-2xl-plus"
              x-text="$t('hero.order')"
              @click="alert('Contacts button been triggered!')"
              data-interactive
            >
              Замовити монтаж
            </button>
            <a
              class="w-72 h-10 tab:h-14 desk:h-16 flex items-center justify-center btn-blur font-alumni font-bold text-lg tab:text-2xl desk:text-2xl-plus"
              href="#portfolio"
              x-text="$t('hero.portfolio')"
              data-interactive
              >Дивитись роботи</a
            >
          </div>
        </div>

        <!-- play/pause button -->
        <button
          :aria-label="isPaused ? $t('hero.playButtonLabel') : $t('hero.pauseButtonLabel')"
          x-transition
          class="rounded-full btn-blur cursor-pointer size-14 tab:size-25 pc:size-35 desk:size-45.5 absolute z-[2] top-23 right-2.5 tab:top-auto tab:bottom-7 tab:right-6 pc:bottom-[8.5%] pc:right-11 desk:bottom-23 desk:right-14"
        >
          <img
            x-show="isPaused"
            x-transition
            src="play.svg"
            class="size-4 tab:size-8.5 pc:size-10 desk:size-13 m-auto"
          />
          <img
            x-show="!isPaused"
            x-transition
            src="pause.svg"
            class="size-4 tab:size-8.5 pc:size-10 desk:size-13 m-auto"
          />
        </button>
      </section>

      <section
        x-data
        id="cardSection"
        class="mx-auto test-style flex flex-col bg-slate-800 rounded w-[80dvw] h-[100dvh] shadow-black shadow-2xl"
      >
        <div
          id="window-head"
          class="border-b border-slate-500 px-3 flex items-center"
        >
          <div class="flex gap-1">
            <div class="w-2 h-2 bg-red-500 rounded-full"></div>
            <div class="w-2 h-2 bg-yellow-400 rounded-full"></div>
            <div class="w-2 h-2 bg-green-500 rounded-full"></div>
            <div
              x-cloak
              x-show="false"
              class="w-2 h-2 bg-blue-500 rounded-full"
            ></div>
          </div>
          <p
            class="text-white font-mono px-auto m-auto"
            x-text="$t('cardSection.head')"
          ></p>
        </div>

        <div class="flex flex-col justify-center h-full">
          <div class="m-auto w-2/3">
            <h1
              x-text="$t('cardSection.header')"
              class="text-4xl text-white font-mono"
            >
              Sorry
            </h1>
            <p
              x-text="$t('cardSection.par_one')"
              class="text-xl text-white font-mono"
            ></p>
            <p
              x-text="$t('cardSection.par_two')"
              class="text-xl text-white font-mono"
            ></p>
            <input
              :checked="$locale() === 'en'"
              @click="$locale($event.target.value)"
              type="radio"
              id="en"
              name="fav_language"
              value="en"
            />
            <label for="en">EN</label><br />
            <input
              :checked="$locale() === 'ua'"
              @click="$locale($event.target.value)"
              type="radio"
              id="ua"
              name="fav_language"
              value="ua"
            />
            <label for="ua">UA</label><br />
          </div>
        </div>
      </section>

      <div
        x-data="{cards: [
      {id: 'services'},
      {id: 'portfolio'},
      {id: 'about'}
      ]}"
      >
        <template x-for="card in cards">
          <x-component
            url="/src/templates/card.html"
            x-data="{ item: card }"
            :id="card.id"
          ></x-component>
        </template>
      </div>
    </main>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
