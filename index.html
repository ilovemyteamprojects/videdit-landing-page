<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/style.css" />
    <title>Videdit</title>
  </head>

  <body
    class="bg-green-500 font-ruda flex flex-col items-center justify-center overflow-x-hidden min-h-screen"
  >
    <section
      id="heroSection"
      x-ref="heroSection"
      x-data="heroSectionData"
      class="relative flex flex-col w-screen h-[100dvh] text-white bg-black"
      @click="pauseVideo"
    >
      <video
        x-ref="headerVideo"
        id="bgVideo"
        muted
        autoplay
        loop
        playsinline
        class="size-full object-cover brightness-65"
      >
        <source src="HeaderVideo.webm" type="video/webm" />
        <source src="HeaderVideo.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>

      <!-- header -->
      <header
        x-data="{isMenuOpen: false, isKeyboardNavigationUsed: false}"
        x-cloak
        x-show="show"
        x-transition.duration.500ms
        class="absolute top-0 flex flex-row justify-between w-full h-20 pc:h-25 px-4 tab:px-6 pc:px-10 desk:px-15 bg-black/60 uppercase"
      >
        <a
          href="#heroSection"
          class="cursor-pointer my-auto"
          :aria-label="$locale() !== 'ua' ? 'to top' : 'вгору'"
          data-interactive
        >
          <img
            id="logo"
            class="size-11 tab:size-16 pc:size-20"
            src="/logo.svg"
            alt="logo"
            data-interactive
          />
        </a>

        <nav class="my-auto hidden pc:flex">
          <ul class="flex gap-10">
            <li>
              <a
                class="hover:underline text-white text-lg font-ruda"
                href="#services"
                x-text="$t('header.services')"
                data-interactive
                >Послуги</a
              >
            </li>
            <li>
              <a
                class="hover:underline text-white text-lg font-ruda"
                href="#portfolio"
                x-text="$t('header.portfolio')"
                data-interactive
                >Портфоліо</a
              >
            </li>
            <li>
              <a
                class="hover:underline text-white text-lg font-ruda"
                href="#about"
                x-text="$t('header.aboutMe')"
                data-interactive
                >Про мене</a
              >
            </li>
          </ul>
        </nav>

        <div id="tools" class="hidden pc:flex gap-6 pr-3">
          <button
            class="tracking-wider uppercase flex h-6 px-2 my-auto hover:cursor-pointer text-lg"
            @click="$locale($locale() === 'ua' ? 'eng' : 'ua')"
            :aria-label="$locale() === 'ua' ? 'Switch to English' : 'Переключити на українську'"
            data-interactive
          >
            <span
              data-interactive
              :class="$locale() === 'ua' ? 'text-white hover:underline' : 'text-white/60 hover:underline'"
              >ua</span
            >|<span
              data-interactive
              :class="$locale() === 'eng' ? 'text-white hover:underline' : 'text-white/60 hover:underline'"
              >eng</span
            >
          </button>
          <button
            id="contactsButton"
            class="barrel-animation h-10 w-22 bg-dark my-auto uppercase text-white text-lg font-bold font-alumni hover:cursor-pointer"
            x-text="$t('header.contacts')"
            @click="$store.modal.openContactModal()"
            data-interactive
          >
            Контакти
          </button>
        </div>

        <button
          class="tracking-wider uppercase pc:hidden flex h-6 px-2 my-auto hover:cursor-pointer text-lg"
          @click="$locale($locale() === 'ua' ? 'eng' : 'ua')"
          :aria-label="$locale() === 'ua' ? 'Switch to English' : 'Переключити на українську'"
          data-interactive
        >
          <span
            data-interactive
            :class="$locale() === 'ua' ? 'text-white hover:underline' : 'text-white/60 hover:underline'"
            >ua</span
          >|<span
            data-interactive
            :class="$locale() === 'eng' ? 'text-white hover:underline' : 'text-white/60 hover:underline'"
            >eng</span
          >
        </button>

        <button
          id="burgerMenu"
          @click="isMenuOpen = true; $nextTick(() => $refs.closeNavButton.focus())"
          @keydown.space="isKeyboardNavigationUsed = true"
          @keydown.enter="isKeyboardNavigationUsed = true"
          :aria-label="$locale() !== 'ua' ? 'open navigation menu' : 'відкрити навігаційне меню'"
          x-show="!isMenuOpen"
          x-ref="burger"
          x-transition:enter="transition transform ease-in duration-500"
          x-transition:enter-start="rotate-0 opacity-0"
          x-transition:enter-end="rotate-360 opacity-100"
          x-transition:leave="transition transform ease-out duration-500"
          x-transition:leave-start="rotate-0 opacity-100"
          x-transition:leave-end="-rotate-360 opacity-0"
          class="my-auto rounded-full mr-[5px] pc:hidden cursor-pointer"
          data-interactive
        >
          <img
            data-interactive
            src="/burger-button.svg"
            alt="menu"
            class="size-11"
          />
        </button>

        <!-- mob menu -->
        <div
          id="mobileMenu"
          @keydown.esc="$nextTick(()=> {if (isKeyboardNavigationUsed)$refs.burger.focus()}); isMenuOpen = false;"
          x-cloak
          x-trap="isMenuOpen"
          x-show="isMenuOpen"
          x-transition:enter="transition-opacity duration-500 ease-in-out"
          x-transition:enter-start="opacity-0"
          x-transition:enter-end="opacity-100"
          x-transition:leave="transition-opacity duration-500 ease-in-out"
          x-transition:leave-start="opacity-100"
          x-transition:leave-end="opacity-0"
          class="pc:hidden flex flex-col w-[100dvw] h-[100dvh] bg-dark fixed z-10 top-0 right-0"
          data-interactive
        >
          <header
            id="mobMenuHeader"
            class="flex flex-row justify-between w-full h-20 pc:h-25 px-4 tab:px-6 pc:px-10 desk:px-15 uppercase"
          >
            <button
              class="cursor-pointer my-auto"
              aria-label="close menu"
              @click="isMenuOpen = false"
              data-interactive
            >
              <img
                id="logo"
                class="size-11 tab:size-16 pc:size-20"
                src="/logo.svg"
                alt="logo"
                data-interactive
              />
            </button>

            <button
              class="tracking-wider uppercase pc:hidden flex h-6 px-2 my-auto hover:cursor-pointer text-lg"
              @click="$locale($locale() === 'ua' ? 'eng' : 'ua')"
              :aria-label="$locale() === 'ua' ? 'Switch to English' : 'Переключити на українську'"
              data-interactive
            >
              <span
                data-interactive
                :class="$locale() === 'ua' ? 'text-white hover:underline' : 'text-white/60 hover:underline'"
                >ua</span
              >|<span
                data-interactive
                :class="$locale() === 'eng' ? 'text-white hover:underline' : 'text-white/60 hover:underline'"
                >eng</span
              >
            </button>

            <button
              id="closeMenu"
              x-ref="closeNavButton"
              @click="isMenuOpen = false; $nextTick(() => $refs.burger.focus())"
              :aria-label="$locale() !== 'ua' ? 'close navigation menu' : 'закрити навігаційне меню'"
              x-show="isMenuOpen"
              x-transition:enter="transition transform ease-in duration-500"
              x-transition:enter-start="rotate-0 opacity-0"
              x-transition:enter-end="rotate-360 opacity-100"
              x-transition:leave="transition transform ease-out duration-500"
              x-transition:leave-start="rotate-0 opacity-100"
              x-transition:leave-end="-rotate-360 opacity-0"
              class="block my-auto rounded-full mr-[5px] pc:hidden cursor-pointer"
              data-interactive
            >
              <img
                data-interactive
                src="/close-button.svg"
                alt="menu"
                class="size-11"
              />
            </button>
          </header>

          <ul class="mx-auto mt-9 flex flex-col gap-5">
            <li class="tab:ml-2">
              <a
                class="w-72 h-10 tab:h-14 desk:h-16 flex items-center justify-center bg-dark font-alumni font-bold text-lg border border-transparent hover:border-light"
                href="#services"
                x-text="$t('header.services')"
                @click="isMenuOpen = false"
                data-interactive
                >Послуги</a
              >
            </li>
            <li class="tab:ml-2">
              <a
                class="w-72 h-10 tab:h-14 desk:h-16 flex items-center justify-center bg-dark font-alumni font-bold text-lg border border-transparent hover:border-light"
                href="#portfolio"
                x-text="$t('header.portfolio')"
                @click="isMenuOpen = false"
                data-interactive
                >Портфоліо</a
              >
            </li>
            <li class="tab:ml-2">
              <a
                class="w-72 h-10 tab:h-14 desk:h-16 flex items-center justify-center bg-dark font-alumni font-bold text-lg border border-transparent hover:border-light"
                href="#about"
                x-text="$t('header.aboutMe')"
                @click="isMenuOpen = false"
                data-interactive
                >Про мене</a
              >
            </li>
            <li class="tab:ml-2">
              <button
                class="w-72 h-10 tab:h-14 desk:h-16 uppercase flex items-center justify-center btn-blur font-alumni font-bold text-lg cursor-pointer"
                x-text="$t('header.contacts')"
                @click="isMenuOpen = false; $store.modal.openContactModal()"
                data-interactive
              >
                Контакти
              </button>
            </li>
          </ul>
        </div>
      </header>

      <!-- title -->
      <div
        x-ref="title"
        x-data="heroTitle"
        x-show="$store.title.isTitleShown"
        x-cloak
        x-effect="isTitleTriggered = show; calcHeroCardOffset()"
        class="p-0 absolute z-[3] min-w-1 leading-tight text-[4rem]"
        :style="styles"
        @transitionend="$store.title.isTitleShown = false"
      >
        <p
          x-text="$t('hero.title')"
          class="uppercase p-0 m-0 font-bold font-alumni text-white"
        ></p>
      </div>

      <!-- card -->
      <!-- inline style & x-effect - for preventing card from flickering
     but still keeping it in the DOM -->
      <div
        style="opacity: 0"
        id="heroCard"
        x-ref="heroContainer"
        x-effect="show ? $refs.heroContainer.style.opacity = '100%' : null"
        class="transition-all ease-in duration-500 flex-col z-[2] absolute bottom-15 tab:bottom-10 pc:bottom-[8.5%] left-[calc((100%-288px)/2)] tab:left-6 pc:left-10 desk:left-16 w-72 tab:w-111 pc:w-150"
      >
        <p
          x-cloak
          x-show="!$store.title.isTitleShown "
          x-text="$t('hero.title')"
          class="uppercase p-0 m-0 font-bold font-alumni text-[2rem] tab:text-[3rem] pc:text-[4rem] desk:text-[5rem] leading-tight text-white text-nowrap"
        ></p>
        <p
          x-text="$t('hero.description')"
          class="tab:w-4/5 pc:w-auto mb-8 tab:mb-14 desk:mb-15 pc:leading-8 text-base tab:text-xl pc:text-2xl desk:text-2xl-plus"
        ></p>

        <div class="flex flex-col pc:flex-row gap-4 tab:gap-6">
          <button
            class="barrel-animation cursor-pointer w-72 h-10 tab:h-14 desk:h-16 bg-dark font-alumni font-bold text-lg tab:text-2xl desk:text-2xl-plus"
            x-text="$t('hero.order')"
            @click="$store.modal.openContactModal()"
            data-interactive
          >
            Замовити монтаж
          </button>
          <a
            class="barrel-animation w-72 h-10 tab:h-14 desk:h-16 flex items-center justify-center btn-blur font-alumni font-bold text-lg tab:text-2xl desk:text-2xl-plus"
            href="#portfolio"
            x-text="$t('hero.portfolio')"
            data-interactive
            >Дивитись роботи</a
          >
        </div>
      </div>

      <!-- play/pause button -->
      <button
        :aria-label="isPaused ? $t('hero.playButtonLabel') : $t('hero.pauseButtonLabel')"
        x-transition
        class="rounded-full btn-blur cursor-pointer size-14 tab:size-25 pc:size-35 desk:size-45.5 absolute z-[1] top-23 right-2.5 tab:top-auto tab:bottom-7 tab:right-6 pc:bottom-[8.5%] pc:right-11 desk:bottom-23 desk:right-14"
      >
        <img
          x-show="isPaused"
          x-transition
          src="play.svg"
          class="size-4 tab:size-8.5 pc:size-10 desk:size-13 m-auto"
        />
        <img
          x-show="!isPaused"
          x-transition
          src="pause.svg"
          class="size-4 tab:size-8.5 pc:size-10 desk:size-13 m-auto"
        />
      </button>
    </section>

    <main>
      <section
        x-data
        id="cardSection"
        class="mx-auto test-style flex flex-col bg-slate-800 rounded w-[80dvw] h-[100dvh] shadow-black shadow-2xl"
      >
        <div
          id="window-head"
          class="border-b border-slate-500 px-3 flex items-center"
        >
          <div class="flex gap-1">
            <div class="w-2 h-2 bg-red-500 rounded-full"></div>
            <div class="w-2 h-2 bg-yellow-400 rounded-full"></div>
            <div class="w-2 h-2 bg-green-500 rounded-full"></div>
            <div
              x-cloak
              x-show="false"
              class="w-2 h-2 bg-blue-500 rounded-full"
            ></div>
          </div>
          <p
            class="text-white font-mono px-auto m-auto"
            x-text="$t('cardSection.head')"
          ></p>
        </div>

        <div class="flex flex-col justify-center h-full">
          <div class="m-auto w-2/3">
            <h1
              x-text="$t('cardSection.header')"
              class="text-4xl text-white font-mono"
            >
              Sorry
            </h1>
            <p
              x-text="$t('cardSection.par_one')"
              class="text-xl text-white font-mono"
            ></p>
            <p
              x-text="$t('cardSection.par_two')"
              class="text-xl text-white font-mono"
            ></p>
            <input
              :checked="$locale() === 'en'"
              @click="$locale($event.target.value)"
              type="radio"
              id="en"
              name="fav_language"
              value="en"
            />
            <label for="en">EN</label><br />
            <input
              :checked="$locale() === 'ua'"
              @click="$locale($event.target.value)"
              type="radio"
              id="ua"
              name="fav_language"
              value="ua"
            />
            <label for="ua">UA</label><br />
          </div>
        </div>
      </section>

      <!-- Dynamic sections -->
      <div
        x-data="{cards: [
        {id: 'services'},
        {id: 'portfolio'},
        {id: 'about'}
        ]}"
      >
        <template x-for="card in cards">
          <x-component
            url="/src/templates/card.html"
            x-data="{ item: card }"
            :id="card.id"
          ></x-component>
        </template>
      </div>
    </main>

    <!-- Contact modal -->
    <div
      x-show="$store.modal.isContactModalOpen"
      x-trap="$store.modal.isContactModalOpen"
      x-cloak
      class="relative z-50"
      x-data="{close() {$store.modal.closeContactModal()}}"
      @keydown.esc.window="close()"
    >
      <!-- Overlay -->
      <div
        x-transition.opacity
        class="fixed flex items-center justify-center inset-0 bg-darker/60"
      >
        <!-- Centered modal -->
        <div
          x-transition
          x-ref="modal"
          @click.outside="close()"
          class="bg-white shadow-lg"
        >
          <div
            class="py-14 tab:py-18 pc:py-14 px-4 tab:px-26 pc:px-8 flex flex-col gap-9 tab:gap-8 pc:flex-row relative"
          >
            <!-- close modal button -->
            <button
              @click="close()"
              class="absolute top-0 right-0 cursor-pointer size-11"
              :aria-label="$locale() !== 'ua' ? 'close contact modal window' : 'закрити вікно з контактами'"
            >
              <svg
                aria-hidden="true"
                viewBox="0 0 44 44"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M13.2122 30.1828C12.5427 29.5133 12.5427 28.4279 13.2122 27.7584L27.7584 13.2122C28.4279 12.5427 29.5133 12.5427 30.1827 13.2122C30.8522 13.8817 30.8522 14.9671 30.1827 15.6366L15.6365 30.1828C14.9671 30.8522 13.8817 30.8523 13.2122 30.1828Z"
                  fill="#323232"
                />
                <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M30.1828 30.1828C30.8523 29.5133 30.8523 28.4279 30.1828 27.7584L15.6366 13.2122C14.9672 12.5427 13.8818 12.5427 13.2123 13.2122C12.5428 13.8817 12.5428 14.9671 13.2123 15.6366L27.7585 30.1828C28.4279 30.8522 29.5133 30.8523 30.1828 30.1828Z"
                  fill="#323232"
                />
              </svg>
            </button>

            <!-- picture -->
            <img
              src="/author-photo-cropped.png"
              alt="rounded photo of woman"
              class="mx-auto pc:mx-0 pc:my-auto rounded-full scale-x-[-1] size-29 tab:size-62.5 pc:size-75"
            />

            <!-- menu list -->
            <ul
              class="flex flex-col gap-5 text-white text-lg font-bold font-alumni uppercase"
            >
              <li class="">
                <a
                  class="flex items-center justify-center w-72 tab:w-98 pc:w-104 h-10 tab:h-14 pc:h-16 mx-auto bg-dark font-bold text-lg tab:text-2xl desk:text-2xl-plus"
                  href="https://www.facebook.com/"
                  target="_blank"
                  data-interactive
                >
                  <div class="w-28.5 tab:w-37 flex items-center gap-3">
                    <img
                      src="/icons/icon_facebook.svg"
                      alt=""
                      aria-hidden="true"
                      class="size-10 tab:size-12"
                    />
                    <span class="">facebook</span>
                  </div>
                </a>
              </li>
              <li class=" ">
                <a
                  class="flex items-center justify-center w-72 tab:w-98 pc:w-104 h-10 tab:h-14 pc:h-16 mx-auto bg-dark font-bold text-lg tab:text-2xl desk:text-2xl-plus"
                  href="https://www.t.me/"
                  target="_blank"
                  data-interactive
                >
                  <div class="w-28.5 tab:w-37 flex items-center gap-3">
                    <img
                      src="/icons/icon_telegram.svg"
                      alt=""
                      aria-hidden="true"
                      class="size-10 tab:size-12"
                    />
                    <span class="">telegram</span>
                  </div>
                </a>
              </li>
              <li class=" ">
                <a
                  class="flex items-center justify-center w-72 tab:w-98 pc:w-104 h-10 tab:h-14 pc:h-16 mx-auto bg-dark font-bold text-lg tab:text-2xl desk:text-2xl-plus"
                  href="https://www.instagram.com/"
                  target="_blank"
                  data-interactive
                >
                  <div class="w-28.5 tab:w-37 flex items-center gap-3">
                    <img
                      src="/icons/icon_instagram.svg"
                      alt=""
                      aria-hidden="true"
                      class="size-10 tab:size-12"
                    />
                    <span class="">instagram</span>
                  </div>
                </a>
              </li>
              <li class=" ">
                <a
                  class="flex items-center justify-center w-72 tab:w-98 pc:w-104 h-10 tab:h-14 pc:h-16 mx-auto bg-dark font-bold text-lg tab:text-2xl desk:text-2xl-plus"
                  href="https://www.gmail.com/"
                  target="_blank"
                  data-interactive
                >
                  <div class="w-28.5 tab:w-37 flex items-center gap-3">
                    <img
                      src="/icons/icon_email.svg"
                      alt=""
                      aria-hidden="true"
                      class="size-10 tab:size-12"
                    />
                    <span class="">e-mail</span>
                  </div>
                </a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
